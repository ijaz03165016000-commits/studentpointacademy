<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verify ID Card | Student Point Academy</title>
<meta name="theme-color" content="#0B2545">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background: var(--paper); margin: 0; font-family: var(--sans); color: var(--ink); }
  .vf-head { background: var(--navy); color: #fff; padding: 14px 16px; }
  .vf-head a { color: #fff; text-decoration: none; display: flex; gap: 10px; align-items: center; max-width: 560px; margin: 0 auto; }
  .vf-head img { width: 34px; height: 34px; }
  .vf-head b { font: 700 1.15rem var(--serif); display: block; }
  .vf-head small { color: #C9D5E6; font-size: .8rem; }
  .vf { max-width: 560px; margin: 24px auto 40px; padding: 0 16px; }
  .vf-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .vf-status { display: flex; gap: 12px; align-items: center; padding: 18px 20px; color: #fff; }
  .vf-status svg { width: 34px; height: 34px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .vf-status h1 { margin: 0; font: 700 1.35rem/1.2 var(--serif); color: inherit; }
  .vf-status p { margin: 2px 0 0; font-size: .92rem; opacity: .92; }
  .vf-status--ok { background: var(--green); }
  .vf-status--bad { background: var(--red); }
  .vf-status--wait { background: var(--navy-2); }
  .vf-body { display: flex; gap: 18px; padding: 20px; align-items: flex-start; flex-wrap: wrap; }
  .vf-photo { width: 116px; height: 145px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: #EEF1F5; flex: none; }
  .vf-body dl { margin: 0; flex: 1; min-width: 200px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .96rem; }
  .vf-body dt { color: var(--muted); }
  .vf-body dd { margin: 0; font-weight: 700; }
  .vf-name { grid-column: 1 / -1; font: 700 1.3rem/1.2 var(--serif); color: var(--navy); margin-bottom: 4px; }
  .vf-note { color: var(--muted); font-size: .88rem; line-height: 1.5; padding: 0 20px 20px; margin: 0; }
  .vf-note a { color: var(--navy); font-weight: 700; }
</style>
</head>
<body>
<header class="vf-head"><a href="index.html"><img src="assets/img/logo-light.svg" alt=""><span><b>Student Point Academy</b><small>ID card verification</small></span></a></header>
<main class="vf" id="main">
  <div class="vf-card" id="result" aria-live="polite">
    <div class="vf-status vf-status--wait"><div><h1>Checking card…</h1><p>Please wait a moment.</p></div></div>
  </div>
</main>
<script type="module">
  import * as store from "./portal/js/store.js";
  import { className } from "./portal/js/school.js";
  import { SITE } from "./assets/js/config.js";

  const el = document.getElementById("result");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fmt = (s) => { if (!s) return "—"; const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return `${d} ${MON[m - 1]} ${y}`; };
  const pad = (n) => String(n).padStart(2, "0");
  const d = new Date(), todayIso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const ICON = {
    ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
    bad: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'
  };
  const contact = `Questions? Contact the academy office: <a href="tel:${esc(SITE.phone)}">${esc(SITE.phone)}</a> · ${esc(SITE.address)}`;
  const status = (tone, title, text) => `<div class="vf-status vf-status--${tone}">${ICON[tone] || ""}<div><h1>${title}</h1><p>${text}</p></div></div>`;

  async function run() {
    const code = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
    if (!/^[A-Z0-9]{12}$/.test(code)) {
      el.innerHTML = status("bad", "No card code", "Scan the QR code on the back of a Student Point Academy ID card to check it.") + `<p class="vf-note" style="padding-top:16px">${contact}</p>`;
      return;
    }
    let c = null;
    try { c = await store.get("cardVerify", code); }
    catch { el.innerHTML = status("bad", "Could not check right now", "Please check your internet connection and scan again.") + `<p class="vf-note" style="padding-top:16px">${contact}</p>`; return; }
    if (!c) {
      el.innerHTML = status("bad", "Card not found", "This code does not match any card issued by Student Point Academy. The card may be fake.") + `<p class="vf-note" style="padding-top:16px">${contact}</p>`;
      return;
    }
    const revoked = c.status !== "valid";
    const expired = !revoked && c.validUntil && c.validUntil < todayIso;
    const student = c.kind === "student";
    const head = revoked ? status("bad", "Card cancelled", "This card has been replaced or cancelled by the academy. Do not accept it.")
      : expired ? status("bad", "Card expired", `This card was valid until ${fmt(c.validUntil)}.`)
      : status("ok", "Valid ID card", `Issued by ${esc(SITE.name)}, ${esc(SITE.city)}.`);
    const rows = student
      ? [["Card no.", c.cardNo], ["Father's name", c.fatherName], ["Class", className(c.classId)], ["Roll no.", c.rollNo]]
      : [["Card no.", c.cardNo], ["Designation", c.designation]];
    rows.push(["Issued", fmt(c.issuedAt)], ["Valid till", fmt(c.validUntil)]);
    el.innerHTML = `${head}
      <div class="vf-body">
        ${c.photo ? `<img class="vf-photo" src="${esc(c.photo)}" alt="Photo of ${esc(c.name)}">` : ""}
        <dl><div class="vf-name">${esc(c.name)}</div>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v || "—")}</dd>`).join("")}</dl>
      </div>
      <p class="vf-note">${revoked || expired ? "" : `Check that the photo matches the person showing the card. `}${student ? "Student card" : "Employee card"} · verification code ${esc(code)}.<br>${contact}</p>`;
  }
  run();
</script>
</body>
</html>
